name: All Plugins - Windows VST3

# Build only when explicitly requested from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: all-plugins-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.product }} - Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: YinyangCompressor
            product: Yinyang Compressor
            test_option: YINYANG_COMPRESSOR_BUILD_TESTS
          - project: ShunDeEsser
            product: Shun De-Esser
            test_option: SHUN_DE_ESSER_BUILD_TESTS
          - project: KuoStereo
            product: Kuo Stereo
            test_option: KUO_STEREO_BUILD_TESTS
          - project: ZaoDrive
            product: Zao Drive
            test_option: ZAO_DRIVE_BUILD_TESTS
          - project: RenTransformer
            product: Ren Transformer
            test_option: REN_TRANSFORMER_BUILD_TESTS
          - project: KuoVelvet
            product: Kuo Velvet
            test_option: KUO_VELVET_BUILD_TESTS
          - project: XuanPhase
            product: Xuan Phase
            test_option: XUAN_PHASE_BUILD_TESTS
          - project: LanReverb
            product: Lan Reverb
            test_option: LAN_REVERB_BUILD_TESTS
          - project: NianSaturator
            product: Nian Saturator
            test_option: NIAN_SATURATOR_BUILD_TESTS
          - project: QinSynth
            product: Qin Synth
            test_option: QIN_SYNTH_BUILD_TESTS
    defaults:
      run:
        shell: pwsh
    env:
      PLUGIN_PROJECT: ${{ matrix.project }}
      PLUGIN_PRODUCT: ${{ matrix.product }}
      PLUGIN_TEST_OPTION: ${{ matrix.test_option }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure VST3
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "projects/$env:PLUGIN_PROJECT"
          $build = Join-Path $env:GITHUB_WORKSPACE "build/windows/$env:PLUGIN_PROJECT"
          & cmake -S $source -B $build -G 'Visual Studio 17 2022' -A x64 `
            "-D$($env:PLUGIN_TEST_OPTION)=OFF" `
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed (exit $LASTEXITCODE)." }

      - name: Build VST3
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "build/windows/$env:PLUGIN_PROJECT"
          & cmake --build $build --config Release --target "$($env:PLUGIN_PROJECT)_VST3" --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "VST3 build failed (exit $LASTEXITCODE)." }

      - name: Check Windows bundle
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "build/windows/$env:PLUGIN_PROJECT"
          $bundle = Join-Path $build "$($env:PLUGIN_PROJECT)_artefacts/Release/VST3/$($env:PLUGIN_PRODUCT).vst3"
          $binary = Join-Path $bundle "Contents/x86_64-win/$($env:PLUGIN_PRODUCT).vst3"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Windows VST3 binary missing: $binary"
          }
          Get-ChildItem -LiteralPath $bundle -Recurse

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-Windows-x64-VST3
          # Temporary transfer artifact for the suite packaging job.
          path: build/windows/${{ matrix.project }}/${{ matrix.project }}_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package Windows suite
    needs: build
    runs-on: windows-2022
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out version file
        uses: actions/checkout@v4

      - name: Collect plugin bundles
        uses: actions/download-artifact@v4
        with:
          pattern: '*-Windows-x64-VST3'
          path: dist
          merge-multiple: true

      - name: Check and zip suite
        id: suite
        run: |
          $versionText = Get-Content projects/PluginVersion.cmake -Raw
          if ($versionText -notmatch 'set\(J_SONIC_PLUGIN_VERSION\s+"([^"]+)"\)') {
            throw 'Shared plugin version was not found.'
          }
          $version = $Matches[1]
          $products = @(
            'Yinyang Compressor', 'Shun De-Esser', 'Kuo Stereo',
            'Zao Drive', 'Ren Transformer', 'Kuo Velvet',
            'Xuan Phase', 'Lan Reverb', 'Nian Saturator', 'Qin Synth'
          )
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $bundles = @(Get-ChildItem -LiteralPath $dist -Filter '*.vst3' -Directory)
          if ($bundles.Count -ne $products.Count) {
            throw "Expected $($products.Count) VST3 bundles, found $($bundles.Count)."
          }
          foreach ($product in $products) {
            $binary = Join-Path $dist "$product.vst3/Contents/x86_64-win/$product.vst3"
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Windows VST3 binary missing from suite: $binary"
            }
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE "J-Sonic-Suite-$version-Windows-x64-VST3.zip"
          Compress-Archive -Path (Join-Path $dist '*.vst3') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw "Suite ZIP was not created: $zip"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload suite ZIP
        uses: actions/upload-artifact@v4
        with:
          name: J-Sonic-Suite-${{ steps.suite.outputs.version }}-Windows-x64-VST3
          path: ${{ steps.suite.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary plugin artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = context.runId;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id, per_page: 100 });
            const temporary = artifacts.filter(a => /^[A-Za-z]+-Windows-x64-VST3$/.test(a.name));
            if (temporary.length !== 10) {
              throw new Error(`Expected 10 temporary plugin artifacts, found ${temporary.length}`);
            }
            for (const artifact of temporary) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }
